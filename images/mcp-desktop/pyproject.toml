[project]
name = "hangar-desktop"
version = "0.1.0"
description = "MCP server exposing desktop control of a Hangar agent's X display"
requires-python = ">=3.11"
dependencies = ["mcp>=1.10,<2", "mss>=9", "pillow>=10", "httpx>=0.27", "playwright>=1.50"]

[project.scripts]
hangar-desktop-mcp = "hangar_desktop.server:main"
hangar-local-agent = "hangar_desktop.local_agent:main"
hangar-report = "hangar_desktop.server:report_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
