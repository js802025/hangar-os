[project]
name = "hangar"
version = "0.1.0"
description = "Hangar: an OS for running AI agents, each on its own hidden desktop"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1",
    "httpx>=0.27",
    "mcp>=1.10,<2",
    "typer>=0.12",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
    "segno>=1.6",
    "cryptography>=42",
]

[project.scripts]
hangar = "hangar.cli:main"
hangar-app = "hangar.apps.launch:main"

[project.optional-dependencies]
apps = [
    "pyside6-essentials>=6.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hangar"]
