# Agent images for both arm64 (Macs, ARM PCs) and amd64 (the Hangar PC), pushed
# to GitHub's registry. The Hangar OS pulls them on first boot.
name: agent images

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Registry path (lowercase)
        run: echo "REG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: base
        uses: docker/build-push-action@v6
        with:
          context: images
          file: images/base/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REG }}/hangar-base:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: gateway
        uses: docker/build-push-action@v6
        with:
          context: images/gateway
          file: images/gateway/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REG }}/hangar-gateway:latest

      - name: flavors
        run: |
          for f in images/flavors/*/; do
            name=$(basename "$f")
            docker buildx build --platform linux/amd64,linux/arm64 --push \
              --build-arg BASE="$REG/hangar-base:latest" \
              -t "$REG/hangar-$name:latest" -f "$f/Containerfile" "$f"
          done
