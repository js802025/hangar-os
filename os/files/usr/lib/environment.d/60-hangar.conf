# Hangar's settings for the user session and its services.
# HANGAR_IMAGES is filled in when the OS image is built (see os/Containerfile).
HANGAR_IMAGES=@HANGAR_IMAGES@
# Agents (rootless containers) reach the daemon through the host's address;
# the firewall keeps it off the LAN (see os/Containerfile).
HANGAR_DAEMON_HOST=0.0.0.0
